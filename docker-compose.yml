version: '3.8'

services:
  # 1. Database Service (Chạy riêng biệt cho Interview)
  mysql-db:
    image: mysql:8.0
    container_name: interview_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: '2005'      # Đổi thành mật khẩu của bạn
      MYSQL_DATABASE: 'interview_db'    # Tên database
    # KHÔNG CẦN mở ports ra VPS để tránh xung đột cổng 3306 với dự án cũ
    volumes:
      - interview_mysql_data:/var/lib/mysql
    networks:
      - interview-network

  # 2. Backend Service (Spring Boot 21)
  backend-api:
    build: ./Backend
    container_name: interview_backend
    restart: unless-stopped
    ports:
      # Lắng nghe 127.0.0.1:8082 trên VPS (An toàn, tránh hacker quét port)
      - "127.0.0.1:8082:8082"
    environment:
      # URL kết nối qua mạng nội bộ Docker interview-network
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/interview_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: '2005'
    depends_on:
      - mysql-db
    networks:
      - interview-network

  # 3. Frontend Service (React Vite + Nginx)
  frontend-ui:
    build: ./FrontEnd
    container_name: interview_frontend
    restart: unless-stopped
    ports:
      # Dùng cổng 3001 (để không đụng Nginx cổng 80 và dự án Food Order cổng 3000)
      - "127.0.0.1:3001:80"
    depends_on:
      - backend-api
    networks:
      - interview-network

networks:
  interview-network:
    driver: bridge

volumes:
  interview_mysql_data: